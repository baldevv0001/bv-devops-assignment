{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "hello-world.serviceAccountName" . }}
  labels:
    {{- include "hello-world.labels" . | nindent 4 }}
  {{- if or .Values.serviceAccount.annotations .Values.commonAnnotations }}
  annotations:
    {{- with .Values.commonAnnotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- with .Values.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
# A dedicated ServiceAccount with no RoleBinding: the workload gets its own
# identity for auditing and for IRSA/Pod Identity, but no Kubernetes API
# permissions whatsoever. Running as "default" would instead inherit whatever
# anyone has bound to that account in the namespace.
automountServiceAccountToken: {{ .Values.automountServiceAccountToken }}
{{- end }}

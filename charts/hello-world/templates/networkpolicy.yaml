{{- if .Values.networkPolicy.enabled }}
{{/* Allow-list only: anything not listed below is dropped. Needs a CNI that enforces it. */}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "hello-world.fullname" . }}
  labels:
    {{- include "hello-world.labels" . | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  podSelector:
    matchLabels:
      {{- include "hello-world.selectorLabels" . | nindent 6 }}
    # Excludes helper pods such as the helm test pod, which set a component label.
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: DoesNotExist
  policyTypes:
    - Ingress
    {{- if .Values.networkPolicy.restrictEgress }}
    - Egress
    {{- end }}
  ingress:
    # Load balancer traffic has no pod or namespace identity to match on.
    {{- if .Values.networkPolicy.allowAllHTTPIngress }}
    - ports:
        - port: http
          protocol: TCP
    {{- else }}
    - from:
        {{- toYaml .Values.networkPolicy.httpFrom | nindent 8 }}
      ports:
        - port: http
          protocol: TCP
    {{- end }}
    # Only the monitoring namespace may reach the metrics port.
    {{- with .Values.networkPolicy.metricsFrom }}
    - from:
        {{- toYaml . | nindent 8 }}
      ports:
        - port: metrics
          protocol: TCP
    {{- end }}
  {{- if .Values.networkPolicy.restrictEgress }}
  egress:
    # DNS is the only outbound traffic this service needs.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    {{- with .Values.networkPolicy.extraEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
{{- end }}

{{- if .Values.podDisruptionBudget.enabled }}
{{/*
A PDB constrains *voluntary* disruption only: node drains, cluster upgrades,
and the descheduler. It cannot protect against a node crashing, which is what
the topology spread constraints are for. The two work together — spread decides
where replicas live, the PDB decides how many may be taken away at once.
*/}}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "hello-world.fullname" . }}
  labels:
    {{- include "hello-world.labels" . | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.podDisruptionBudget.maxUnavailable }}
  maxUnavailable: {{ .Values.podDisruptionBudget.maxUnavailable }}
  {{- else }}
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "hello-world.selectorLabels" . | nindent 6 }}
{{- end }}

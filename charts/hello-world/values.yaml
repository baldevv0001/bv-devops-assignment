# Default values for the hello-world chart.
# Defaults are production-shaped. Local test overrides live in ci/kind-values.yaml.

# -- Replica count. Ignored when autoscaling.enabled is true.
replicaCount: 3

image:
  # -- Set to "" for images already loaded onto the node, as the kind test does.
  registry: docker.io
  repository: baldevv0001/hello-world
  # -- Defaults to .Chart.AppVersion when empty.
  tag: ""
  # -- Takes precedence over tag. A digest pins exact content; a tag can move.
  digest: ""
  pullPolicy: IfNotPresent

# -- Secrets for pulling from a private registry.
imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

# -- Cluster DNS domain, used to build fully-qualified service names.
clusterDomain: cluster.local

# -- Labels added to every rendered object.
commonLabels: {}
# -- Annotations added to every rendered object.
commonAnnotations: {}

config:
  # -- Body returned by GET /.
  message: "Hello World"
  # -- One of debug, info, warn, error.
  logLevel: info
  # -- Time spent serving while NotReady after SIGTERM, so kube-proxy can catch up.
  drainDelay: 5s
  # -- Budget for finishing in-flight requests after the drain window.
  shutdownTimeout: 15s

# -- Additional environment variables, in normal container env format.
extraEnv: []

serviceAccount:
  create: true
  # -- Generated from the release name when empty.
  name: ""
  # -- Annotations, e.g. eks.amazonaws.com/role-arn for IRSA.
  annotations: {}

# -- Off because the app never calls the Kubernetes API; an absent token cannot leak.
automountServiceAccountToken: false

service:
  # -- ClusterIP, NodePort or LoadBalancer.
  type: ClusterIP
  port: 80
  annotations: {}
  # -- Fixed node port, only used when type is NodePort.
  nodePort: ""
  # -- Source ranges for a LoadBalancer. Empty means AWS defaults to 0.0.0.0/0.
  loadBalancerSourceRanges: []

# A separate ClusterIP Service for metrics. A LoadBalancer publishes every port
# it lists, so putting 9090 on the main Service would expose it to the internet.
metricsService:
  enabled: true
  port: 9090
  annotations: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: hello-world.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    # -- Unset on purpose: a CPU limit throttles via CFS quota and causes latency
    # spikes even when the node is idle. The request already guarantees a share.
    cpu: ""
    # -- Set, because memory is incompressible and a leak would OOM the node.
    memory: 128Mi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  # -- Set to a number to also scale on memory. Usually a poor signal for Go.
  targetMemoryUtilizationPercentage: ""
  behavior:
    scaleDown:
      # -- Scale down slowly, so the next traffic bump is not served cold.
      stabilizationWindowSeconds: 300
    scaleUp:
      stabilizationWindowSeconds: 30

podDisruptionBudget:
  enabled: true
  # -- Keeps two replicas during a node drain. Set only one of the two fields.
  minAvailable: 2
  maxUnavailable: ""

topologySpread:
  enabled: true
  zone:
    # -- Hard requirement: a replica stays Pending rather than stacking into one zone.
    whenUnsatisfiable: DoNotSchedule
    maxSkew: 1
  node:
    # -- Preferred only, so a small cluster can still schedule.
    whenUnsatisfiable: ScheduleAnyway
    maxSkew: 1

# maxUnavailable 0 means a new pod must be Ready before an old one goes away.
updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 0
    maxSurge: 1

# -- Must exceed drainDelay + shutdownTimeout, or the kubelet kills the drain.
terminationGracePeriodSeconds: 30

networkPolicy:
  enabled: true
  # -- Load balancer traffic has no pod or namespace identity to match on.
  allowAllHTTPIngress: true
  # -- Extra peers allowed on the HTTP port when allowAllHTTPIngress is false.
  httpFrom: []
  # -- Namespaces allowed to scrape the metrics port.
  metricsFrom:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: monitoring
  # -- Restrict egress to DNS. The service makes no outbound calls.
  restrictEgress: true
  # -- Extra egress rules appended when restrictEgress is true.
  extraEgress: []

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  # -- The binary is static and writes nothing, so no scratch volume is needed.
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault

probes:
  startup:
    enabled: true
    # -- 30 x 1s allows a slow start; liveness does not run until this passes.
    periodSeconds: 1
    failureThreshold: 30
  liveness:
    enabled: true
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3
  readiness:
    enabled: true
    periodSeconds: 5
    timeoutSeconds: 2
    # -- Low on purpose: shedding a bad pod fast beats tolerating a blip.
    failureThreshold: 2
    successThreshold: 1

# -- Needs the prometheus-operator CRDs, so off by default.
serviceMonitor:
  enabled: false
  interval: 30s
  scrapeTimeout: 10s
  # -- Some installations need a release label here for the operator to select it.
  labels: {}
  relabelings: []
  metricRelabelings: []

# -- Alert rules ship with the chart so they match the app version. Needs the CRDs.
prometheusRule:
  enabled: false
  labels: {}
  # -- Fraction of 5xx responses that triggers the error-rate alert.
  errorRateThreshold: 0.05
  # -- p99 latency in seconds that triggers the latency alert.
  latencyP99Seconds: 0.5
  # -- Minimum distinct nodes before the spread alert fires.
  minZones: 3

# -- Dashboard delivered as a ConfigMap that the Grafana sidecar picks up.
grafanaDashboard:
  enabled: false
  # -- Must match the stack's sidecar.dashboards.label value.
  label: grafana_dashboard
  labelValue: "1"
  # -- Grafana folder to file the dashboard under.
  folder: ""

podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
# -- Merged alongside the generated topology spread constraints, not replacing them.
affinity: {}
priorityClassName: ""

# Configuration for `helm test`.
tests:
  enabled: true
  image:
    repository: curlimages/curl
    tag: "8.19.0"

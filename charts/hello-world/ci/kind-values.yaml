# Local kind test values. Only what cannot work locally is overridden; replica
# count, spread, PDB, security context and NetworkPolicy stay at their defaults.

image:
  # Loaded onto each node by `kind load docker-image`, so nothing is pulled.
  registry: ""
  repository: hello-world
  tag: "ci"
  pullPolicy: IfNotPresent

# No metrics-server on kind, so an HPA would sit at one replica. The HPA path is
# covered by template-render assertions instead.
autoscaling:
  enabled: false
replicaCount: 3

# Speeds up the rolling-update test.
config:
  drainDelay: 2s
  shutdownTimeout: 5s
terminationGracePeriodSeconds: 15

# Reachable from the host via the port mapping in test/kind/cluster.yaml.
service:
  type: NodePort
  port: 80
  # Matches the extraPortMapping in test/kind/cluster.yaml.
  nodePort: 30080

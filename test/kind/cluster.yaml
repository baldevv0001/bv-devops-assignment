# Three-worker kind cluster with fake availability-zone labels. Without them
# there is one topology domain and the zone spread constraint proves nothing.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: hello-world

nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      # Exposes the app NodePort on the host, so no port-forward is needed.
      - containerPort: 30080
        hostPort: 30080
        protocol: TCP

  - role: worker
    labels:
      topology.kubernetes.io/region: ap-south-1
      topology.kubernetes.io/zone: ap-south-1a

  - role: worker
    labels:
      topology.kubernetes.io/region: ap-south-1
      topology.kubernetes.io/zone: ap-south-1b

  - role: worker
    labels:
      topology.kubernetes.io/region: ap-south-1
      topology.kubernetes.io/zone: ap-south-1c

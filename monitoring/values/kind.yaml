# Local kind overrides on top of common.yaml, mostly to fit in laptop memory.

prometheus:
  prometheusSpec:
    retention: 2h
    replicas: 1

    # No PersistentVolume: kind has no CSI driver, so a PVC would stay Pending.
    resources:
      requests:
        cpu: 100m
        memory: 400Mi
      limits:
        memory: 1Gi

alertmanager:
  alertmanagerSpec:
    replicas: 1
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 128Mi

grafana:
  replicas: 1
  persistence:
    enabled: false
  # Local only. On EKS this comes from a Secret; see eks.yaml.
  adminPassword: admin
  service:
    type: NodePort
    nodePort: 30300
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi

kubeStateMetrics:
  resources:
    requests:
      cpu: 10m
      memory: 64Mi

prometheus-node-exporter:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi

prometheusOperator:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi

# These bind to 127.0.0.1 on kind, so scraping them would leave permanently-down
# targets that make a working setup look broken.
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeEtcd:
  enabled: false
kubeProxy:
  enabled: false

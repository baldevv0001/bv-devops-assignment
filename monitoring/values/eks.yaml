# Overrides for EKS.
#
# Layered on top of common.yaml.

prometheus:
  prometheusSpec:
    retention: 15d
    retentionSize: 18GB

    # A single replica: this is a demonstration cluster, and two replicas would
    # double the storage cost while still not being a real HA setup (that needs
    # Thanos or a remote write target for deduplication and long-term storage).
    replicas: 1

    storageSpec:
      volumeClaimTemplate:
        spec:
          # Created by scripts/apply-storage-class.sh, encrypted with the
          # customer-managed KMS key Terraform provisions.
          storageClassName: gp3
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 20Gi

    resources:
      requests:
        cpu: 250m
        memory: 1Gi
      limits:
        memory: 2Gi

alertmanager:
  alertmanagerSpec:
    replicas: 1
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: gp3
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 2Gi
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        memory: 256Mi

grafana:
  replicas: 1

  persistence:
    enabled: true
    storageClassName: gp3
    size: 5Gi

  # Read from a Secret created out of band, so no password is committed and
  # none appears in `helm get values`. scripts/install-monitoring.sh generates
  # one if it does not exist.
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password

  # ClusterIP by default. A public Grafana with no TLS and no SSO is not
  # something to expose on a load balancer; reach it with:
  #   kubectl -n monitoring port-forward svc/kube-prometheus-stack-grafana 3000:80
  service:
    type: ClusterIP

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi

prometheusOperator:
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi

# EKS runs the control plane on AWS-managed infrastructure that is not
# reachable for scraping. These targets can never come up, so leaving them
# enabled produces permanent "down" alerts that train everyone to ignore
# alerts. Control plane metrics come from the API server target and from
# CloudWatch instead.
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeEtcd:
  enabled: false

# kube-proxy on EKS binds its metrics port to 127.0.0.1 unless reconfigured, so
# scraping it needs a change to the kube-proxy ConfigMap that is out of scope
# here.
kubeProxy:
  enabled: false

kubeApiServer:
  enabled: true

# EKS overrides on top of common.yaml.

prometheus:
  prometheusSpec:
    retention: 15d
    retentionSize: 18GB

    # One replica: two would double storage cost without being real HA.
    replicas: 1

    storageSpec:
      volumeClaimTemplate:
        spec:
          # Created by scripts/apply-storage-class.sh, encrypted with a CMK.
          storageClassName: gp3
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 20Gi

    resources:
      requests:
        cpu: 250m
        memory: 1Gi
      limits:
        memory: 2Gi

alertmanager:
  alertmanagerSpec:
    replicas: 1
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: gp3
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 2Gi
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        memory: 256Mi

grafana:
  replicas: 1

  persistence:
    enabled: true
    storageClassName: gp3
    size: 5Gi

  # From a Secret, so no password is committed or shown by `helm get values`.
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password

  # ClusterIP: Grafana has no TLS or SSO here, so reach it with a port-forward.
  service:
    type: ClusterIP

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi

prometheusOperator:
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi

# The EKS control plane is AWS-managed and cannot be scraped, so these would be
# permanently down.
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeEtcd:
  enabled: false

# kube-proxy binds to 127.0.0.1 unless its ConfigMap is changed.
kubeProxy:
  enabled: false

kubeApiServer:
  enabled: true

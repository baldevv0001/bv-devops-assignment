# Shared kube-prometheus-stack values. Only the parts that need an opinion are
# set here; everything else stays at the chart defaults.

fullnameOverride: kube-prometheus-stack

# --- Prometheus -------------------------------------------------------------
prometheus:
  prometheusSpec:
    # Select ServiceMonitors from any release, since the app is a separate one.
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false
    scrapeConfigSelectorNilUsesHelmValues: false

    scrapeInterval: 30s
    evaluationInterval: 30s

    # Keeps series from two clusters distinguishable in one store.
    externalLabels:
      cluster: hello-world

    # Matches the posture of the application chart.
    securityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 2000
      fsGroup: 2000
      seccompProfile:
        type: RuntimeDefault

# --- Alertmanager -----------------------------------------------------------
alertmanager:
  alertmanagerSpec:
    securityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 2000
      fsGroup: 2000
      seccompProfile:
        type: RuntimeDefault

  config:
    global:
      resolve_timeout: 5m
    route:
      group_by: ['alertname', 'namespace']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      receiver: 'null'
      routes:
        # Watchdog fires constantly by design, as proof the pipeline is alive.
        - matchers: [alertname = "Watchdog"]
          receiver: 'null'
        - matchers: [severity = "critical"]
          receiver: 'critical'
    receivers:
      - name: 'null'
      - name: 'critical'
        # Empty: a webhook URL is a secret. See monitoring/README.md.
    templates:
      - '/etc/alertmanager/config/*.tmpl'

# --- Grafana ----------------------------------------------------------------
grafana:
  defaultDashboardsEnabled: true
  defaultDashboardsTimezone: browser

  # Loads dashboards from ConfigMaps carrying this label, with no API calls.
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: ALL
      folderAnnotation: k8s-sidecar-target-directory
      provider:
        foldersFromFilesStructure: true
    datasources:
      enabled: true

  grafana.ini:
    analytics:
      reporting_enabled: false
      check_for_updates: false
    users:
      # No user management and no TLS here, so sign-up stays closed.
      allow_sign_up: false
    auth.anonymous:
      enabled: false

# --- Cluster component scraping ---------------------------------------------
# Turned off per-environment where the targets are unreachable.
kubeApiServer:
  enabled: true
kubeControllerManager:
  enabled: true
kubeScheduler:
  enabled: true
kubeProxy:
  enabled: true
kubeEtcd:
  enabled: true

kubeStateMetrics:
  enabled: true
nodeExporter:
  enabled: true
